      enum:
      - 1X2
      - DOUBLE_CHANCE
      - DRAW_NO_BET
      - OU_05
      - OU_15
      - OU_25
      - OU_35
      - OU_45
      - BTTS
      - BTTS_OU25
      - HOME_OU_15
      - AWAY_OU_05
      - HT_FT
      - HT_1X2
      - HT_OU_15
      - HC_0
      - HC_M05
      - HC_M1
      - HC_M15
      - HC_M2
      - HC_EURO
      - CORRECT_SCORE
      - ODD_EVEN
      - BTTS_1H
      - CLEAN_HOME
      - CLEAN_AWAY
      - FIRST_SCORE
      - MULTI_HOME
      - MULTI_AWAY
      - CORNERS_OU
      - TENNIS_WINNER
      - TENNIS_HC
